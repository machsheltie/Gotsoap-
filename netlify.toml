# Netlify build config for the Got Soap? campaign site (Astro, lives in site/).
#
# CWAAA is NOT built here. It has its own Netlify site deployed from cwaaa/
# (see cwaaa/netlify.toml); the footer's "Funded by …" seam links to that
# origin via CWAAA_SITE_URL. The interim /cwaaa mount was retired 2026-09-15.
[build]
  base    = "site"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.12.0"
