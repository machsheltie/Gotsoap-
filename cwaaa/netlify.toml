# Netlify build config for the standalone CWAAA site (Astro, lives in cwaaa/).
# Not yet connected to a deployment: origins are an owner decision (CW-D07).
# The repository root netlify.toml still deploys the combined runtime in site/.
[build]
  base    = "cwaaa"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.12.0"

# `Case Files` is a retired label (surface brief 8). The old paths keep working
# so anything already published at them lands on the record, not on a 404.
[[redirects]]
  from = "/case-files"
  to = "/recovery-stories"
  status = 301

[[redirects]]
  from = "/case-files/*"
  to = "/recovery-stories/:splat"
  status = 301
